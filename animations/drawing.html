<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Fullscreen Drawing Board</title>
  <style>
    :root{
      --ui-bg: rgba(255,255,255,0.85);
      --ui-fg: #111;
      --accent: #0b84ff;
    }
    html,body{height:100%;margin:0;font-family:system-ui,Segoe UI,Roboto,Arial}
    .app{
      height:100%;width:100%;display:grid;grid-template-columns:1fr auto;align-items:start;
      background:linear-gradient(180deg,#f7f9fc,#eef4ff);
    }
    canvas#board{
      width:100%;height:100%;display:block;touch-action:none;cursor:crosshair;
    }
    .toolbar{
      position:fixed;right:14px;top:14px;backdrop-filter: blur(6px);background:var(--ui-bg);
      color:var(--ui-fg);padding:10px;border-radius:12px;box-shadow:0 6px 18px rgba(12,22,48,0.12);
      display:flex;flex-direction:column;gap:8px;z-index:40;min-width:220px;
    }
    .row{display:flex;gap:8px;align-items:center}
    label{font-size:12px}
    .btn{border:0;padding:8px 10px;border-radius:8px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,0.06);cursor:pointer}
    .btn.secondary{background:#f4f6fb}
    input[type=range]{width:120px}
    .color-swatch{width:28px;height:28px;border-radius:6px;border:1px solid rgba(0,0,0,0.08);cursor:pointer}
    .small{font-size:12px;padding:6px 8px}
    .flex-row{display:flex;gap:8px;align-items:center}
    footer.hint{position:fixed;left:14px;bottom:14px;background:var(--ui-bg);padding:8px 10px;border-radius:10px;box-shadow:0 6px 18px rgba(12,22,48,0.08);font-size:13px}
  </style>
</head>
<body>
  <div class="app">
    <canvas id="board" aria-label="Drawing board"></canvas>

    <div class="toolbar" role="toolbar" aria-label="Drawing tools">
      <div class="row">
        <label for="color">Color</label>
        <input id="color" type="color" value="#0b84ff" aria-label="Brush color"/>
        <div id="colorPreview" class="color-swatch" title="Current color"></div>
      </div>

      <div class="row">
        <label for="size">Size</label>
        <input id="size" type="range" min="1" max="120" value="6" />
        <span id="sizeVal">6</span>px
      </div>

      <div class="row">
        <label for="opacity">Opacity</label>
        <input id="opacity" type="range" min="0.05" max="1" step="0.05" value="1" />
        <span id="opacityVal">1.00</span>
      </div>

      <div class="row flex-row">
        <button id="pen" class="btn small" aria-pressed="true">Pen</button>
        <button id="eraser" class="btn small secondary" aria-pressed="false">Eraser</button>
        <button id="clear" class="btn small">Clear</button>
      </div>

      <div class="row flex-row">
        <button id="undo" class="btn small">Undo</button>
        <button id="save" class="btn small">Save PNG</button>
      </div>

      <div style="font-size:12px;color:#333;opacity:0.9;margin-top:6px">Tips: Use mouse, touch, or stylus. Ctrl/Cmd+Z to undo.</div>
    </div>

    <footer class="hint">Shortcuts: <strong>Ctrl/Cmd+Z</strong> undo • <strong>Space</strong> toggle eraser</footer>
  </div>

  <script>
    (function(){
      const canvas = document.getElementById('board');
      const ctx = canvas.getContext('2d', { willReadFrequently: false });
      let drawing = false;
      let isEraser = false;
      let last = {x:0,y:0, pressure:0};
      let brush = {color: '#0b84ff', size: 6, opacity: 1};

      // Undo stack as ImageBitmap URLs (dataURL) - limit 12
      const undoStack = [];
      const UNDO_LIMIT = 12;

      // UI
      const colorInput = document.getElementById('color');
      const colorPreview = document.getElementById('colorPreview');
      const sizeInput = document.getElementById('size');
      const sizeVal = document.getElementById('sizeVal');
      const opacityInput = document.getElementById('opacity');
      const opacityVal = document.getElementById('opacityVal');
      const penBtn = document.getElementById('pen');
      const eraserBtn = document.getElementById('eraser');
      const clearBtn = document.getElementById('clear');
      const undoBtn = document.getElementById('undo');
      const saveBtn = document.getElementById('save');

      function setColor(c){ brush.color = c; colorPreview.style.background = c }
      setColor(colorInput.value);

      function resizeCanvas() {
        // Save current content
        const data = canvas.toDataURL();
        const dpr = Math.max(window.devicePixelRatio || 1, 1);
        canvas.width = Math.floor(window.innerWidth * dpr);
        canvas.height = Math.floor(window.innerHeight * dpr);
        canvas.style.width = window.innerWidth + 'px';
        canvas.style.height = window.innerHeight + 'px';
        ctx.scale(dpr, dpr);

        // Restore saved content
        const img = new Image();
        img.onload = () => { ctx.drawImage(img, 0, 0, window.innerWidth, window.innerHeight); }
        img.src = data;
      }

      window.addEventListener('resize', () => {
        // throttle with rAF
        requestAnimationFrame(resizeCanvas);
      });

      // Initialize
      resizeCanvas();

      function pushUndo(){
        try{
          if(undoStack.length >= UNDO_LIMIT) undoStack.shift();
          undoStack.push(canvas.toDataURL());
          updateUndoButtons();
        }catch(e){console.warn('Undo push failed',e)}
      }

      function updateUndoButtons(){ undoBtn.disabled = undoStack.length === 0 }

      function doUndo(){
        if(undoStack.length === 0) return;
        const lastData = undoStack.pop();
        const img = new Image();
        img.onload = () => { ctx.clearRect(0,0,canvas.width,canvas.height); ctx.drawImage(img,0,0,window.innerWidth,window.innerHeight); updateUndoButtons(); }
        img.src = lastData;
      }

      // Drawing helpers
      function getPointerPos(evt){
        const rect = canvas.getBoundingClientRect();
        return { x: evt.clientX - rect.left, y: evt.clientY - rect.top };
      }

      function pointerDown(evt){
        evt.preventDefault();
        drawing = true;
        canvas.setPointerCapture && canvas.setPointerCapture(evt.pointerId);
        last = { ...getPointerPos(evt), pressure: (evt.pressure || 0.5) };
        pushUndo();
        drawDot(last.x, last.y, last.pressure);
      }

      function pointerMove(evt){
        if(!drawing) return;
        const pos = getPointerPos(evt);
        const pressure = evt.pressure || 0.5;
        drawLine(last.x, last.y, pos.x, pos.y, pressure);
        last = { x: pos.x, y: pos.y, pressure };
      }

      function pointerUp(evt){
        drawing = false;
        try{ canvas.releasePointerCapture && canvas.releasePointerCapture(evt.pointerId); }catch(e){}
      }

      function drawDot(x,y,pressure){
        ctx.save();
        ctx.globalCompositeOperation = isEraser ? 'destination-out' : 'source-over';
        ctx.globalAlpha = brush.opacity;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.fillStyle = brush.color;
        const size = brush.size * (pressure || 1);
        ctx.beginPath();
        ctx.arc(x, y, size/2, 0, Math.PI*2);
        ctx.fill();
        ctx.restore();
      }

      function drawLine(x1,y1,x2,y2,pressure){
        ctx.save();
        ctx.globalCompositeOperation = isEraser ? 'destination-out' : 'source-over';
        ctx.globalAlpha = brush.opacity;
        ctx.strokeStyle = brush.color;
        ctx.lineWidth = Math.max(1, brush.size * (pressure || 1));
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
        ctx.restore();
      }

      // Pointer events
      canvas.addEventListener('pointerdown', pointerDown);
      canvas.addEventListener('pointermove', pointerMove);
      window.addEventListener('pointerup', pointerUp);

      // Prevent scrolling with touch when touching canvas
      canvas.addEventListener('touchstart', e => { e.preventDefault(); }, { passive:false });

      // UI binding
      colorInput.addEventListener('input', e => { setColor(e.target.value); });
      sizeInput.addEventListener('input', e => { brush.size = Number(e.target.value); sizeVal.textContent = e.target.value; });
      opacityInput.addEventListener('input', e => { brush.opacity = Number(e.target.value); opacityVal.textContent = Number(e.target.value).toFixed(2); });

      penBtn.addEventListener('click', () => { isEraser = false; penBtn.setAttribute('aria-pressed','true'); eraserBtn.setAttribute('aria-pressed','false'); penBtn.classList.remove('secondary'); eraserBtn.classList.add('secondary'); canvas.style.cursor='crosshair'; });
      eraserBtn.addEventListener('click', () => { isEraser = true; penBtn.setAttribute('aria-pressed','false'); eraserBtn.setAttribute('aria-pressed','true'); penBtn.classList.add('secondary'); eraserBtn.classList.remove('secondary'); canvas.style.cursor='cell'; });

      clearBtn.addEventListener('click', () => { pushUndo(); ctx.clearRect(0,0,canvas.width,canvas.height); });
      undoBtn.addEventListener('click', doUndo);

      saveBtn.addEventListener('click', () => {
        // Convert to dataURL at CSS resolution
        const dataUrl = canvas.toDataURL('image/png');
        const a = document.createElement('a');
        a.href = dataUrl;
        a.download = `drawing-${new Date().toISOString().replace(/[:.]/g,'-')}.png`;
        a.click();
      });

      // Keyboard shortcuts
      window.addEventListener('keydown', (e) => {
        if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z'){
          e.preventDefault(); doUndo();
        }
        if(e.code === 'Space'){
          e.preventDefault(); // avoid scroll
          // toggle eraser
          isEraser = !isEraser;
          penBtn.setAttribute('aria-pressed', (!isEraser).toString());
          eraserBtn.setAttribute('aria-pressed', (isEraser).toString());
          penBtn.classList.toggle('secondary', isEraser);
          eraserBtn.classList.toggle('secondary', !isEraser);
        }
      });

      // Initialize UI values
      sizeVal.textContent = sizeInput.value;
      opacityVal.textContent = Number(opacityInput.value).toFixed(2);

      // Helpful: prevent context menu on right-click
      canvas.addEventListener('contextmenu', e => e.preventDefault());

      // Accessibility: double-tap to clear (on touch)
      let lastTap = 0;
      canvas.addEventListener('touchend', (e)=>{
        const now = Date.now();
        if(now - lastTap < 300){ pushUndo(); ctx.clearRect(0,0,canvas.width,canvas.height); }
        lastTap = now;
      });

      // make sure initial blank state is undoable
      pushUndo();

    })();
  </script>
</body>
</html>
