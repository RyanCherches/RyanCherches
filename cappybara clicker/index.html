<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nugget clicker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>

    </header>
    <main>
        <div class="nugget_clicker">
            <div class="cookie">
                <p class="amount"></p>
                <img src="capybara-hamburger.svg" alt="capybara" class="nugget">
            </div>
            <div class="controls">
                <div class="upgrades">
                    <div>
                        <h1>upgrades:</h1>
                    </div>
                    <div class="double_clicker_speed item center">
                        <p>double the clicker speed upgrade</p>
                        <p class="center">1,000</p>
                    </div>
                    <div class="double_clicker_power item center">
                        <p>double the clicker power upgrade</p>
                        <p class="center">10,000</p>
                    </div>
                    <div class="double_multiplier item center">
                        <p>double the multiplier power upgrade</p>
                        <p class="center">100,000</p>
                    </div>
                </div>
                <div class="store">
                    <div class="item clicker">
                        <img src="clicker.svg" height="75px">
                        <p>clicker</p>      
                        <p class="clicker_price">15</p>
                        <p class="clicker_amount"></p>
                    </div>
                  
                    <div class="item multiplier">
                        <img src="2x.png" alt="2x image" height="75px">
                        <p>multiplier</p>
                        <p class="multiplier_amount"></p>
                        <p class="multiplier_price">100</p>
                    </div>
                    <div class="item clicker_multiplier">
                        <img src="2x.png" alt="2x clicker" height="75px">
                        <p>click multiplier</p>
                        <p class="clicker_multiplier_amount"></p>
                        <p class="clicker_multiplier_price">100</p>
                    </div>
                </div>
                <button type="button" class="reset">reset size change</button>
                <br><br><br>
                <button type="button" class="full_reset">full reset(RESTART NOT REBIRTH and reload the page after for the text to change)</button>
                <br><br><br>
                <button type="button" class="rebirth">Rebirth</button>
            </div>
            <div>

        </div>
        
    </main>
<script src="script.js"></script>
</body>
</html>
