<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nugget clicker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>

    </header>
    <main>
        <div class="nugget_clicker">
            <div class="cookie">
                <p class="amount"></p>
                <img src="capybara-hamburger.svg" alt="nugget" class="nugget" height="200px">
            </div>
            <div class="upgrades">
                <div class="clicker">
                    <img src="clicker.svg" height="75px">
                    <p>clicker</p>
                    <p class="clicker_amount"></p>
                    <p class="clicker_price">15</p>
                </div>
                <div class="multiplier">
                    <img src="2x.png" alt="2x image" height="75px">
                    <p>multiplier</p>
                    <p class="multiplier_amount"></p>
                    <p class="multiplier_price">100</p>
                </div>
                <div class="buttons">
                    <center>
                        <button type="button" class="reset">reset size change</button>
                        <br><br><br>
                        <button type="button" class="full_reset">full reset(RESTART NOT REBIRTH and reload the page after for the text to change)</button>
                        <br><br><br>
                        <button type="button" class="rebirth">Rebirth</button>
                    </center>
                </div>
            </div>
        </div>
    </main>
<script src="script.js"></script>
</body>
</html>
