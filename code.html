<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expirement with code</title>
    <style>
        header {
            display:flex;
            flex-direction:row;
            justify-content:space-between;
        }
    </style>
</head>
<body>
    <header>
    <label>Put HTML(only HTML will work) code and let the magic to the rest</label>
    <br><br>
    <textarea id="code" style="width: 750px; height: 250px;">Type code here</textarea>
    <button type="button">change</button>
    <a href="main.html">go home</a>
    </header>
    <main>

    </main>
    <script>
        let code = document.getElementById("code");
        let canvas = document.querySelector("main");
        let button = document.querySelector("button");
        button.addEventListener("click", function() {
            canvas.innerHTML = code.value;
        });
    </script>
</body>
</html>
