<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="../">
    <title>admin page</title>
    <script src="server_config.js"></script>
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            display:flex;
            justify-content:center;
            flex-direction:column;
            align-items:center;
        }
        button {
            background-color: #333;
            border: none;
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #555;
        }
        .link {
            color: #fff;
            text-decoration: none;
            font-size: 18px;
            margin-bottom: 20px;
            margin-top:10px;
            transition: 0.5s ease;
        }
        .link:hover {
            text-decoration: underline;
            color:lightgreen;
            transform: scale(1.1);
        }
        /* admin players panel */
        .admin-panel { display:flex; gap:20px; margin-top:20px; }
        .players-list { width:260px; background:#111; padding:12px; border-radius:6px; max-height:420px; overflow:auto; }
        .players-list button { display:block; width:100%; text-align:left; margin-bottom:6px; }
        .player-detail { flex:1; background:#0b0b0b; padding:12px; border-radius:6px; max-height:420px; overflow:auto; }
        .inv-item { padding:6px; border-bottom:1px solid #222; }
    </style>
    <script>
        // Show a helpful warning when pages are opened via file:// (localStorage may be isolated)
        function showFileProtocolWarning() {
            if (location.protocol === 'file:') {
                const warn = document.createElement('div');
                warn.style.background = '#441111';
                warn.style.color = '#ffdcdc';
                warn.style.padding = '8px 12px';
                warn.style.borderRadius = '6px';
                warn.style.margin = '10px 0';
                warn.textContent = 'Note: you are viewing this page via file:// — some browsers isolate localStorage per-file. Run a local webserver (e.g. `python -m http.server`) and open via http://localhost to share data between pages.';
                document.addEventListener('DOMContentLoaded', () => {
                    document.body.insertBefore(warn, document.body.firstChild);
                });
            }
        }
        showFileProtocolWarning();
        function giveEpic() {
            let inventory = JSON.parse(localStorage.getItem("inventory")) || [];
            const newItem = {
                name: "Doge",
                rarity: "Epic",
                id: Date.now()
            };

            inventory.push(newItem);

            localStorage.setItem("inventory", JSON.stringify(inventory));
        }
        function giveMythic() {
            let inventory = JSON.parse(localStorage.getItem("inventory")) || [];
            const newItem = {
                name: "Doge",
                rarity: "Mythic",
                id: Date.now()
            };

            inventory.push(newItem);

            localStorage.setItem("inventory", JSON.stringify(inventory));
        }
        function giveLegendary() {
            let inventory = JSON.parse(localStorage.getItem("inventory")) || [];
            const newItem = {
                name: "Doge",
                rarity: "Legendary",
                id: Date.now()
            };

            inventory.push(newItem);

            localStorage.setItem("inventory", JSON.stringify(inventory));
        }
        function giveGodly() {
            let inventory = JSON.parse(localStorage.getItem("inventory")) || [];
            const newItem = {
                name: "Doge",
                rarity: "Godly",
                id: Date.now()
            };

            inventory.push(newItem);

            localStorage.setItem("inventory", JSON.stringify(inventory));
        }
        function removeEpic() {
            let inventory = JSON.parse(localStorage.getItem("inventory")) || [];

            // find the first item with rarity "Godly"
            const index = inventory.findIndex(item => item.rarity === "Godly");

            if (index !== -1) {
                inventory.splice(index, 1); // remove exactly one
                localStorage.setItem("inventory", JSON.stringify(inventory));
                console.log("One Godly item removed!");
                location.reload(); // update UI
            } else {
                console.log("No Godly items found in inventory.");
            }
        }
        function removeMythic() {
            let inventory = JSON.parse(localStorage.getItem("inventory")) || [];

            // find the first item with rarity "Mythic"
            const index = inventory.findIndex(item => item.rarity === "Mythic");
            if (index !== -1) {
                inventory.splice(index, 1); // remove exactly one
                localStorage.setItem("inventory", JSON.stringify(inventory));
                console.log("One Mythic item removed!");
                location.reload(); // update UI
            } else {
                console.log("No Mythic items found in inventory.");
            }
        }
        function removeLegendary() {
            let inventory = JSON.parse(localStorage.getItem("inventory")) || [];

            // find the first item with rarity "Legendary"
            const index = inventory.findIndex(item => item.rarity === "Legendary");
            if (index !== -1) {
                inventory.splice(index, 1); // remove exactly one
                localStorage.setItem("inventory", JSON.stringify(inventory));
                console.log("One Legendary item removed!");
                location.reload(); // update UI
            } else {
                console.log("No Legendary items found in inventory.");
            }
        }
        function removeGodly() {
            let inventory = JSON.parse(localStorage.getItem("inventory")) || [];

            // find the first item with rarity "Godly"
            const index = inventory.findIndex(item => item.rarity === "Godly");

            if (index !== -1) {
                inventory.splice(index, 1); // remove exactly one
                localStorage.setItem("inventory", JSON.stringify(inventory));
                console.log("One Godly item removed!");
                location.reload(); // update UI
            } else {
                console.log("No Godly items found in inventory.");
            }
        }

        // ===== Players admin functions =====
        async function loadPlayers() {
                    // try central server first (configurable)
                    let players = {};
                    try {
                        const server = (window.SERVER_URL || 'http://localhost:3000').replace(/\/$/, '');
                        const res = await fetch(server + '/api/players');
                        if (res.ok) players = await res.json();
                    } catch (e) {
                        // fallback to localStorage
                        players = JSON.parse(localStorage.getItem('dedogeium_players')) || {};
                    }
            // also import any inventory_<name> keys present in localStorage
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (!key) continue;
                if (key.startsWith('inventory_')) {
                    const name = key.slice('inventory_'.length);
                    try {
                        const inv = JSON.parse(localStorage.getItem(key)) || [];
                        if (!players[name]) {
                            players[name] = { firstSeen: null, lastSeen: null, visits: 0, inventory: inv };
                        } else {
                            // only set inventory if not present
                            players[name].inventory = players[name].inventory || inv;
                        }
                    } catch (e) { /* ignore malformed */ }
                }
            }

            // If no players recorded, or to ensure current session keys are included,
            // prioritize the exact `Username` / `Password` variables saved by the login page.
            const sessionName = localStorage.getItem('Username');
            if (sessionName) {
                try {
                    const name = String(sessionName).trim().toLowerCase();
                    if (name && !players[name]) {
                        const invKey = 'inventory_' + name;
                        let inv = [];
                        try { inv = JSON.parse(localStorage.getItem(invKey)) || JSON.parse(localStorage.getItem('inventory')) || []; } catch(e) { inv = []; }
                        const pwd = localStorage.getItem('Password') || null;
                        players[name] = { firstSeen: null, lastSeen: Date.now(), visits: 1, inventory: inv, password: pwd };
                    }
                } catch (e) { /* ignore */ }
            }

            // If still empty, attempt broader discovery using common keys and inventory_* entries
            if (Object.keys(players).length === 0) {
                const usernameKeys = ['Uabcd','username','user','playerName','signup_user','name'];
                const passKeys = ['Pabc','password','pass','pwd'];
                for (let k of usernameKeys) {
                    const v = localStorage.getItem(k);
                    if (!v) continue;
                    const name = String(v).trim().toLowerCase();
                    if (!name) continue;
                    if (!players[name]) {
                        let inv = [];
                        try { inv = JSON.parse(localStorage.getItem('inventory_' + name)) || JSON.parse(localStorage.getItem('inventory')) || []; } catch(e) { inv = [] }
                        let pwd = null;
                        for (let pk of passKeys) {
                            const pv = localStorage.getItem(pk);
                            if (pv) { pwd = pv; break; }
                        }
                        players[name] = { firstSeen: null, lastSeen: null, visits: 1, inventory: inv, password: pwd };
                    }
                }
            }
            const list = document.getElementById('players-list');
            const detail = document.getElementById('player-detail');
            list.innerHTML = '';
            detail.innerHTML = '<p>Select a player to view inventory.</p>';

            // place import/export UI above player list if not already present
            const container = document.getElementById('players-list-container');
            if (container) return; // already inserted

            const names = Object.keys(players).sort((a,b)=> (players[b].lastSeen||0) - (players[a].lastSeen||0));
            if (names.length === 0) {
                list.innerHTML = '<p style="color:#bbb">No players recorded yet.</p>';
                return;
            }

            names.forEach(name => {
                const p = players[name];
                const btn = document.createElement('button');
                btn.textContent = `${name} (${p.visits || 1})`;
                btn.addEventListener('click', () => showPlayer(name));
                list.appendChild(btn);
            });
        }

        // Export dedogeium_players as a JSON file
        function exportPlayers() {
            const players = JSON.parse(localStorage.getItem('dedogeium_players')) || {};
            const blob = new Blob([JSON.stringify(players, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'dedogeium_players.json';
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
        }

        // Merge players object into localStorage
        function mergePlayers(newPlayers) {
            const existing = JSON.parse(localStorage.getItem('dedogeium_players')) || {};
            Object.keys(newPlayers).forEach(name => {
                const np = newPlayers[name] || {};
                const ep = existing[name] || { firstSeen: null, lastSeen: null, visits: 0, inventory: [] };

                // merge timestamps and visits
                ep.firstSeen = ep.firstSeen ? Math.min(ep.firstSeen, np.firstSeen || ep.firstSeen) : (np.firstSeen || ep.firstSeen);
                ep.lastSeen = ep.lastSeen ? Math.max(ep.lastSeen, np.lastSeen || ep.lastSeen) : (np.lastSeen || ep.lastSeen);
                ep.visits = (ep.visits || 0) + (np.visits || 0);

                // prefer password if we don't have one
                if (!ep.password && np.password) ep.password = np.password;

                // merge inventories by id
                const existingInv = ep.inventory || [];
                const newInv = np.inventory || [];
                const map = {};
                existingInv.concat(newInv).forEach(it => { if (it && it.id) map[it.id] = it; });
                ep.inventory = Object.values(map);

                existing[name] = ep;
                // also store inventory_<name>
                try { localStorage.setItem('inventory_' + name, JSON.stringify(ep.inventory)); } catch (e) {}
            });
            localStorage.setItem('dedogeium_players', JSON.stringify(existing));
            loadPlayers();
        }

        // Import players from uploaded file input
        function importPlayersFromFile(e) {
            const file = e.target.files && e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function() {
                try {
                    const parsed = JSON.parse(reader.result);
                    mergePlayers(parsed);
                    alert('Import complete.');
                } catch (err) { alert('Failed to parse JSON'); }
            };
            reader.readAsText(file);
            // clear input
            e.target.value = '';
        }

        // Import players from pasted JSON textarea
        function importPlayersFromText() {
            const ta = document.getElementById('players-import-text');
            if (!ta) return;
            try {
                const parsed = JSON.parse(ta.value);
                mergePlayers(parsed);
                ta.value = '';
                alert('Import complete.');
            } catch (err) { alert('Invalid JSON'); }
        }

        function showPlayer(name) {
            const players = JSON.parse(localStorage.getItem('dedogeium_players')) || {};
            const p = players[name];
            const detail = document.getElementById('player-detail');
            detail.innerHTML = '';
            if (!p) { detail.innerHTML = '<p>Player not found.</p>'; return; }

            const meta = document.createElement('div');
            meta.innerHTML = `<h3>${name}</h3><p>First: ${p.firstSeen ? new Date(p.firstSeen).toLocaleString() : 'n/a'}</p><p>Last: ${p.lastSeen ? new Date(p.lastSeen).toLocaleString() : 'n/a'}</p><p>Visits: ${p.visits || 1}</p><p>Password: ${p.password ? p.password : 'n/a'}</p><hr>`;
            detail.appendChild(meta);

            const inv = p.inventory || JSON.parse(localStorage.getItem('inventory_' + name)) || [];
            if (inv.length === 0) {
                const n = document.createElement('p'); n.textContent = 'No inventory recorded.'; detail.appendChild(n); return;
            }

            inv.forEach(item => {
                const div = document.createElement('div');
                div.className = 'inv-item';
                div.textContent = `${item.name || 'Item'} — ${item.rarity || 'Unknown'} (id:${item.id || 'n/a'})`;
                detail.appendChild(div);
            });
        }
    </script>
</head>

    <a href="customize/" class="link">Go to customize page</a>
    <div class="admin-panel">

    <br><br><br><br><br><br><br>
    <button id="give-epic" onclick="giveEpic()">Give Epic</button>
    <button id="give-mythic" onclick="giveMythic()">Give Mythic</button>
    <button id="give-legendary" onclick="giveLegendary()">Give Legendary</button>
    <button id="give-godly" onclick="giveGodly()">Give Godly</button>
    <br><br><br><br><br><br><br>
    <button id="remove-epic" onclick="removeEpic()">Remove Epic</button>
    <button id="remove-mythic" onclick="removeMythic()">Remove Mythic</button>
    <button id="remove-legendary" onclick="removeLegendary()">Remove Legendary</button>
    <button id="remove-godly" onclick="removeGodly()">Remove Godly</button>

    <script>
        // initialize players panel after DOM ready
        document.addEventListener('DOMContentLoaded', function() {
            try { loadPlayers(); } catch (e) { console.error(e); }
        });
    </script>
</body>
