<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="../">
    <title>admin page</title>
    <script src="server_defaults.js"></script>
    <script src="server_config.js"></script>
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            display:flex;
            justify-content:center;
            flex-direction:column;
            align-items:center;
        }
        button {
            background-color: #333;
            border: none;
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #555;
        }
        .link {
            color: #fff;
            text-decoration: none;
            font-size: 18px;
            margin-bottom: 20px;
            margin-top:10px;
            transition: 0.5s ease;
        }
        .link:hover {
            text-decoration: underline;
            color:lightgreen;
            transform: scale(1.1);
        }
        /* admin players panel */
        .admin-panel { display:flex; gap:20px; margin-top:20px; }
        .players-list { width:260px; background:#111; padding:12px; border-radius:6px; max-height:420px; overflow:auto; }
        .players-list button { display:block; width:100%; text-align:left; margin-bottom:6px; }
        .players-list button.is-banned { border-left:4px solid #ff5c5c; color:#ffdcdc; }
        .player-detail { flex:1; background:#0b0b0b; padding:12px; border-radius:6px; max-height:420px; overflow:auto; }
        .inv-item { padding:6px; border-bottom:1px solid #222; }
        .ban-badge { color:#ffb4b4; font-weight:bold; }
        .leaderboard-ban-panel { margin:12px 0; padding:12px; border:1px solid #552222; border-radius:8px; background:#170707; }
        .quick-ban-panel { width:min(720px, calc(100% - 32px)); }
        .leaderboard-ban-panel h4 { margin:0 0 8px; }
        .leaderboard-ban-panel label { display:block; margin:8px 0 4px; color:#ddd; }
        .leaderboard-ban-panel input,
        .leaderboard-ban-panel select,
        .leaderboard-ban-panel textarea { width:100%; box-sizing:border-box; padding:8px; border-radius:6px; border:1px solid #333; background:#070707; color:#fff; }
        .ban-duration-row { display:flex; gap:8px; }
        .ban-duration-row input,
        .ban-duration-row select { flex:1; }
        .admin-status { min-height:18px; color:#bbb; }
    </style>
    <script>
        // Show a helpful warning when pages are opened via file:// (localStorage may be isolated)
        function showFileProtocolWarning() {
            if (location.protocol === 'file:') {
                const warn = document.createElement('div');
                warn.style.background = '#441111';
                warn.style.color = '#ffdcdc';
                warn.style.padding = '8px 12px';
                warn.style.borderRadius = '6px';
                warn.style.margin = '10px 0';
                warn.textContent = 'Note: you are viewing this page via file:// — some browsers isolate localStorage per-file. Run a local webserver (e.g. `python -m http.server`) and open via http://localhost to share data between pages.';
                document.addEventListener('DOMContentLoaded', () => {
                    document.body.insertBefore(warn, document.body.firstChild);
                });
            }
        }
        showFileProtocolWarning();
        function giveEpic() {
            let inventory = JSON.parse(localStorage.getItem("inventory")) || [];
            const newItem = {
                name: "Doge",
                rarity: "Epic",
                id: Date.now()
            };

            inventory.push(newItem);

            localStorage.setItem("inventory", JSON.stringify(inventory));
        }
        function giveMythic() {
            let inventory = JSON.parse(localStorage.getItem("inventory")) || [];
            const newItem = {
                name: "Doge",
                rarity: "Mythic",
                id: Date.now()
            };

            inventory.push(newItem);

            localStorage.setItem("inventory", JSON.stringify(inventory));
        }
        function giveLegendary() {
            let inventory = JSON.parse(localStorage.getItem("inventory")) || [];
            const newItem = {
                name: "Doge",
                rarity: "Legendary",
                id: Date.now()
            };

            inventory.push(newItem);

            localStorage.setItem("inventory", JSON.stringify(inventory));
        }
        function giveGodly() {
            let inventory = JSON.parse(localStorage.getItem("inventory")) || [];
            const newItem = {
                name: "Doge",
                rarity: "Godly",
                id: Date.now()
            };

            inventory.push(newItem);

            localStorage.setItem("inventory", JSON.stringify(inventory));
        }
        function removeEpic() {
            let inventory = JSON.parse(localStorage.getItem("inventory")) || [];

            // find the first item with rarity "Godly"
            const index = inventory.findIndex(item => item.rarity === "Godly");

            if (index !== -1) {
                inventory.splice(index, 1); // remove exactly one
                localStorage.setItem("inventory", JSON.stringify(inventory));
                console.log("One Godly item removed!");
                location.reload(); // update UI
            } else {
                console.log("No Godly items found in inventory.");
            }
        }
        function removeMythic() {
            let inventory = JSON.parse(localStorage.getItem("inventory")) || [];

            // find the first item with rarity "Mythic"
            const index = inventory.findIndex(item => item.rarity === "Mythic");
            if (index !== -1) {
                inventory.splice(index, 1); // remove exactly one
                localStorage.setItem("inventory", JSON.stringify(inventory));
                console.log("One Mythic item removed!");
                location.reload(); // update UI
            } else {
                console.log("No Mythic items found in inventory.");
            }
        }
        function removeLegendary() {
            let inventory = JSON.parse(localStorage.getItem("inventory")) || [];

            // find the first item with rarity "Legendary"
            const index = inventory.findIndex(item => item.rarity === "Legendary");
            if (index !== -1) {
                inventory.splice(index, 1); // remove exactly one
                localStorage.setItem("inventory", JSON.stringify(inventory));
                console.log("One Legendary item removed!");
                location.reload(); // update UI
            } else {
                console.log("No Legendary items found in inventory.");
            }
        }
        async function setSqlPlayerTitle(title) {
            const username = selectedAdminPlayer || localStorage.getItem("Username");
            if (!username) {
                alert("Select a SQL player first.");
                return;
            }

            try {
                await adminApi('/api/merge', {
                    method: 'POST',
                    body: {
                        [username]: {
                            title,
                            profileStats: {
                                title,
                                updatedAt: Date.now(),
                            },
                        },
                    },
                });
                await loadPlayers();
                showPlayer(username);
                alert("SQL title set to '" + title + "' for " + username);
            } catch (error) {
                alert("SQL title update failed: " + error.message);
            }
        }

        function setAdminTitle() {
            setSqlPlayerTitle("admin");
        }

        function setCustomTitle() {
            const title = document.getElementById("title-input").value.trim();
            if (!title) {
                alert("Enter a title first.");
                return;
            }
            setSqlPlayerTitle(title);
        }

        // ===== Players admin functions =====
        let adminPlayers = {};
        let selectedAdminPlayer = "";

        function escapeHtml(value) {
            return String(value ?? "").replace(/[&<>"']/g, character => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                "\"": "&quot;",
                "'": "&#39;",
            }[character]));
        }

        function getAdminServerBase() {
            const allowOriginServer = typeof window.DEDOGEIUM_ALLOW_ORIGIN_SERVER === "boolean"
                ? window.DEDOGEIUM_ALLOW_ORIGIN_SERVER
                : true;
            const originServer = allowOriginServer && window.location.origin && window.location.origin !== "null"
                ? window.location.origin
                : "";
            return (window.SERVER_URL || localStorage.getItem(window.DEDOGEIUM_SERVER_STORAGE_KEY || "dedogeiumServerUrl") || originServer || "").replace(/\/$/, "");
        }

        async function adminApi(path, options = {}) {
            const server = getAdminServerBase();
            if (!server) throw new Error("No Dedogeium server is configured.");
            const response = await fetch(server + path, {
                method: options.method || "GET",
                headers: { "Content-Type": "application/json" },
                body: options.body ? JSON.stringify(options.body) : undefined,
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok) {
                throw new Error(data && data.error ? data.error : "The admin server request failed.");
            }
            return data;
        }

        function saveAdminPlayers(players) {
            adminPlayers = players && typeof players === "object" ? players : {};
        }

        function normalizeLeaderboardBan(rawBan) {
            if (!rawBan || typeof rawBan !== "object") return null;
            const permanent = rawBan.permanent === true;
            const until = permanent ? null : Math.max(0, Math.round(Number(rawBan.until) || 0));
            const active = rawBan.active !== false && (permanent || until > 0);
            if (!active && !rawBan.reason && !rawBan.bannedAt) return null;
            return {
                active,
                permanent,
                until,
                reason: typeof rawBan.reason === "string" ? rawBan.reason : "",
                bannedAt: Math.max(0, Math.round(Number(rawBan.bannedAt) || 0)),
                bannedBy: typeof rawBan.bannedBy === "string" ? rawBan.bannedBy : "admin",
            };
        }

        function isLeaderboardBanActive(rawBan) {
            const ban = normalizeLeaderboardBan(rawBan);
            if (!ban || ban.active === false) return false;
            return ban.permanent || (Number(ban.until) || 0) > Date.now();
        }

        function getLeaderboardBanLabel(rawBan) {
            const ban = normalizeLeaderboardBan(rawBan);
            if (!ban) return "Not banned from leaderboard.";
            if (isLeaderboardBanActive(ban)) {
                return ban.permanent
                    ? `Permanently banned${ban.reason ? ` - ${ban.reason}` : ""}.`
                    : `Banned until ${new Date(ban.until).toLocaleString()}${ban.reason ? ` - ${ban.reason}` : ""}.`;
            }
            return `Previous ban expired${ban.until ? ` on ${new Date(ban.until).toLocaleString()}` : ""}.`;
        }

        function getDurationMsFromControls() {
            const amount = Math.max(1, Number(document.getElementById("leaderboard-ban-duration")?.value) || 1);
            const unit = document.getElementById("leaderboard-ban-unit")?.value || "hours";
            const multipliers = {
                minutes: 60 * 1000,
                hours: 60 * 60 * 1000,
                days: 24 * 60 * 60 * 1000,
            };
            return Math.round(amount * (multipliers[unit] || multipliers.hours));
        }

        function updateStoredPlayer(name, player) {
            if (!name || !player) return;
            const players = { ...adminPlayers, [name]: player };
            saveAdminPlayers(players);
        }

        function setBanFeedback(message, isError) {
            const el = document.getElementById("leaderboard-ban-feedback");
            if (!el) return;
            el.textContent = message || "";
            el.style.color = isError ? "#ffb4b4" : "#b7ffb7";
        }

        function setQuickBanFeedback(message, isError) {
            const el = document.getElementById("quick-leaderboard-ban-feedback");
            if (!el) return;
            el.textContent = message || "";
            el.style.color = isError ? "#ffb4b4" : "#b7ffb7";
        }

        function updateQuickBanPlayerList(names) {
            const select = document.getElementById("quick-leaderboard-ban-username");
            if (!select) return;
            const previous = select.value;
            select.innerHTML = '<option value="">Select a player</option>';
            names.forEach((name) => {
                const option = document.createElement("option");
                option.value = name;
                const player = adminPlayers[name] || {};
                option.textContent = `${name}${isLeaderboardBanActive(player.leaderboardBan) ? " (leaderboard banned)" : ""}`;
                select.appendChild(option);
            });
            if (previous && names.includes(previous)) {
                select.value = previous;
            }
        }

        function getQuickBanUsername() {
            return String(document.getElementById("quick-leaderboard-ban-username")?.value || "").trim().toLowerCase();
        }

        function getQuickBanDurationMs() {
            const amount = Math.max(1, Number(document.getElementById("quick-leaderboard-ban-duration")?.value) || 1);
            const unit = document.getElementById("quick-leaderboard-ban-unit")?.value || "hours";
            const multipliers = {
                minutes: 60 * 1000,
                hours: 60 * 60 * 1000,
                days: 24 * 60 * 60 * 1000,
            };
            return Math.round(amount * (multipliers[unit] || multipliers.hours));
        }

        async function quickBanLeaderboardPlayer() {
            const name = getQuickBanUsername();
            if (!name) {
                setQuickBanFeedback("Enter a username first.", true);
                return;
            }
            const permanent = Boolean(document.getElementById("quick-leaderboard-ban-permanent")?.checked);
            const reason = document.getElementById("quick-leaderboard-ban-reason")?.value.trim() || "";
            const durationMs = permanent ? 0 : getQuickBanDurationMs();
            try {
                const data = await adminApi("/api/admin/leaderboard-ban", {
                    method: "POST",
                    body: { username: name, permanent, durationMs, reason },
                });
                updateStoredPlayer(name, data.player);
                setQuickBanFeedback(`${name} is now banned from the SQL leaderboard.`, false);
            } catch (error) {
                setQuickBanFeedback(`SQL ban failed: ${error.message}`, true);
                return;
            }
            await loadPlayers();
            showPlayer(name);
        }

        async function quickUnbanLeaderboardPlayer() {
            const name = getQuickBanUsername();
            if (!name) {
                setQuickBanFeedback("Enter a username first.", true);
                return;
            }
            try {
                const data = await adminApi("/api/admin/leaderboard-unban", {
                    method: "POST",
                    body: { username: name },
                });
                updateStoredPlayer(name, data.player);
                setQuickBanFeedback(`${name} is unbanned from the SQL leaderboard.`, false);
            } catch (error) {
                setQuickBanFeedback(`SQL unban failed: ${error.message}`, true);
                return;
            }
            await loadPlayers();
            showPlayer(name);
        }

        async function banLeaderboardPlayer(name) {
            const permanent = Boolean(document.getElementById("leaderboard-ban-permanent")?.checked);
            const reason = document.getElementById("leaderboard-ban-reason")?.value.trim() || "";
            const durationMs = permanent ? 0 : getDurationMsFromControls();
            const payload = { username: name, permanent, durationMs, reason };
            try {
                const data = await adminApi("/api/admin/leaderboard-ban", { method: "POST", body: payload });
                updateStoredPlayer(name, data.player);
                setBanFeedback("Leaderboard ban saved on the SQL server.", false);
            } catch (error) {
                setBanFeedback(`SQL ban failed: ${error.message}`, true);
                return;
            }
            await loadPlayers();
            showPlayer(name);
        }

        async function unbanLeaderboardPlayer(name) {
            try {
                const data = await adminApi("/api/admin/leaderboard-unban", { method: "POST", body: { username: name } });
                updateStoredPlayer(name, data.player);
                setBanFeedback("Leaderboard ban removed on the SQL server.", false);
            } catch (error) {
                setBanFeedback(`SQL unban failed: ${error.message}`, true);
                return;
            }
            await loadPlayers();
            showPlayer(name);
        }

        function appendLeaderboardBanControls(detail, name, player) {
            const wrapper = document.createElement("div");
            wrapper.className = "leaderboard-ban-panel";
            wrapper.innerHTML = `
                <h4>Leaderboard Ban</h4>
                <p>Current: <span class="${isLeaderboardBanActive(player.leaderboardBan) ? "ban-badge" : ""}">${escapeHtml(getLeaderboardBanLabel(player.leaderboardBan))}</span></p>
                <label><input id="leaderboard-ban-permanent" type="checkbox"> Permanent ban</label>
                <label>Temporary ban length</label>
                <div class="ban-duration-row">
                    <input id="leaderboard-ban-duration" type="number" min="1" value="24">
                    <select id="leaderboard-ban-unit">
                        <option value="minutes">minutes</option>
                        <option value="hours" selected>hours</option>
                        <option value="days">days</option>
                    </select>
                </div>
                <label for="leaderboard-ban-reason">Reason shown to admins</label>
                <textarea id="leaderboard-ban-reason" rows="2" placeholder="Optional reason"></textarea>
                <div>
                    <button id="ban-leaderboard-btn" type="button">Ban From Leaderboard</button>
                    <button id="unban-leaderboard-btn" type="button">Unban From Leaderboard</button>
                </div>
                <p id="leaderboard-ban-feedback" class="admin-status"></p>
            `;
            detail.appendChild(wrapper);
            document.getElementById("ban-leaderboard-btn").addEventListener("click", () => banLeaderboardPlayer(name));
            document.getElementById("unban-leaderboard-btn").addEventListener("click", () => unbanLeaderboardPlayer(name));
        }

        async function loadPlayers() {
            const list = document.getElementById('players-list');
            const detail = document.getElementById('player-detail');
            list.innerHTML = '';
            detail.innerHTML = '<p>Select a player to view inventory.</p>';
            list.innerHTML = '<p style="color:#bbb">Loading SQL players...</p>';

            let players = {};
            try {
                players = await adminApi('/api/players');
            } catch (error) {
                saveAdminPlayers({});
                updateQuickBanPlayerList([]);
                list.innerHTML = `<p style="color:#ffb4b4">Could not load SQL players: ${escapeHtml(error.message)}. Start the Dedogeium server and open this page from the server URL.</p>`;
                return;
            }

            saveAdminPlayers(players);
            list.innerHTML = '';

            const names = Object.keys(players).sort((a,b)=> (players[b].lastSeen||0) - (players[a].lastSeen||0));
            updateQuickBanPlayerList(names);
            if (names.length === 0) {
                list.innerHTML = '<p style="color:#bbb">No players recorded yet.</p>';
                return;
            }

            names.forEach(name => {
                const p = players[name];
                const btn = document.createElement('button');
                btn.textContent = `${name} (${p.visits || 1})${isLeaderboardBanActive(p.leaderboardBan) ? ' - leaderboard banned' : ''}`;
                if (isLeaderboardBanActive(p.leaderboardBan)) btn.classList.add('is-banned');
                btn.addEventListener('click', () => showPlayer(name));
                list.appendChild(btn);
            });
        }

        // Export the SQL players as a JSON file.
        async function exportPlayers() {
            let players = adminPlayers;
            try {
                players = await adminApi('/api/players');
                saveAdminPlayers(players);
                updateQuickBanPlayerList(Object.keys(players).sort((a,b)=> (players[b].lastSeen||0) - (players[a].lastSeen||0)));
            } catch (error) {
                alert('SQL export failed: ' + error.message);
                return;
            }
            const blob = new Blob([JSON.stringify(players, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'dedogeium_sql_players.json';
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
        }

        // Merge a players object into SQL through the admin server.
        async function mergePlayers(newPlayers) {
            if (!newPlayers || typeof newPlayers !== 'object' || Array.isArray(newPlayers)) {
                alert('Import JSON must be a players object.');
                return false;
            }

            try {
                await adminApi('/api/merge', {
                    method: 'POST',
                    body: newPlayers,
                });
                await loadPlayers();
                alert('SQL import complete.');
                return true;
            } catch (error) {
                alert('SQL import failed: ' + error.message);
                return false;
            }
        }

        // Import players from uploaded file input
        function importPlayersFromFile(e) {
            const file = e.target.files && e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async function() {
                try {
                    const parsed = JSON.parse(reader.result);
                    await mergePlayers(parsed);
                } catch (err) { alert('Failed to parse JSON'); }
            };
            reader.readAsText(file);
            // clear input
            e.target.value = '';
        }

        // Import players from pasted JSON textarea
        async function importPlayersFromText() {
            const ta = document.getElementById('players-import-text');
            if (!ta) return;
            try {
                const parsed = JSON.parse(ta.value);
                const ok = await mergePlayers(parsed);
                if (ok) ta.value = '';
            } catch (err) { alert('Invalid JSON'); }
        }

        function showPlayer(name) {
            selectedAdminPlayer = name;
            const players = adminPlayers || {};
            const p = players[name];
            const detail = document.getElementById('player-detail');
            detail.innerHTML = '';
            if (!p) { detail.innerHTML = '<p>Player not found in SQL. Reload players and try again.</p>'; return; }

            const meta = document.createElement('div');
            meta.innerHTML = `<h3>${escapeHtml(name)}</h3><p>First: ${p.firstSeen ? new Date(p.firstSeen).toLocaleString() : 'n/a'}</p><p>Last: ${p.lastSeen ? new Date(p.lastSeen).toLocaleString() : 'n/a'}</p><p>Visits: ${p.visits || 1}</p><p>Password: ${p.password ? escapeHtml(p.password) : 'n/a'}</p><p>Leaderboard: <span class="${isLeaderboardBanActive(p.leaderboardBan) ? 'ban-badge' : ''}">${escapeHtml(getLeaderboardBanLabel(p.leaderboardBan))}</span></p><hr>`;
            detail.appendChild(meta);
            appendLeaderboardBanControls(detail, name, p);

            const inv = Array.isArray(p.inventory) ? p.inventory : [];
            if (inv.length === 0) {
                const n = document.createElement('p'); n.textContent = 'No inventory recorded.'; detail.appendChild(n); return;
            }

            inv.forEach(item => {
                const div = document.createElement('div');
                div.className = 'inv-item';
                div.textContent = `${item.name || 'Item'} — ${item.rarity || 'Unknown'} (id:${item.id || 'n/a'})`;
                detail.appendChild(div);
            });
        }
    </script>
</head>
<body>

    <div class="leaderboard-ban-panel quick-ban-panel">

                <option value="minutes">minutes</option>
                <option value="hours" selected>hours</option>
                <option value="days">days</option>
            </select>
        </div>
        <label for="quick-leaderboard-ban-reason">Reason shown to admins</label>
        <textarea id="quick-leaderboard-ban-reason" rows="2" placeholder="Optional reason"></textarea>

    </div>
    <div class="admin-panel">
        <div>
            <!-- <div style="margin-bottom:8px; display:flex; gap:8px; align-items:center;">
                <button onclick="exportPlayers()">Export Players</button>
                <input type="file" id="players-import-file" accept="application/json" onchange="importPlayersFromFile(event)">
                <button onclick="(function(){ const ta = document.getElementById('players-import-text'); ta.style.display = ta.style.display === 'block' ? 'none' : 'block'; })()">Toggle Paste Import</button>

            <div id="players-import-hint" style="color:#bbb; font-size:12px; margin-bottom:6px;"></div>
            <textarea id="players-import-text" placeholder='Paste SQL players JSON here' style="width:240px; height:80px; display:none;"></textarea>
            <!-- <div style="margin-top:6px;"><button onclick="importPlayersFromText()">Import Pasted JSON</button></div> -->
            <div class="players-list" id="players-list">Loading players...</div>
        </div>
        <div class="player-detail" id="player-detail">Loading...</div>
    </div>
    <br><br><br><br><br><br><br>
    <button id="give-epic" onclick="giveEpic()">Give Epic</button>
    <button id="give-mythic" onclick="giveMythic()">Give Mythic</button>
    <button id="give-legendary" onclick="giveLegendary()">Give Legendary</button>
    <button id="give-godly" onclick="giveGodly()">Give Godly</button>
    <br><br><br><br><br><br><br>
    <button id="remove-epic" onclick="removeEpic()">Remove Epic</button>
    <button id="remove-mythic" onclick="removeMythic()">Remove Mythic</button>
    <button id="remove-legendary" onclick="removeLegendary()">Remove Legendary</button>
    <button id="remove-godly" onclick="removeGodly()">Remove Godly</button>
    <br><br>
    <button onclick="setAdminTitle()">Set Admin Title</button>
    <br><br>
    <input type="text" id="title-input" placeholder="Enter new title">
    <button onclick="setCustomTitle()">Set Custom Title</button>

    <script>
        // initialize players panel after DOM ready
        document.addEventListener('DOMContentLoaded', function() {
            try { loadPlayers(); } catch (e) { console.error(e); }
            document.getElementById("quick-ban-leaderboard-btn")?.addEventListener("click", quickBanLeaderboardPlayer);
            document.getElementById("quick-unban-leaderboard-btn")?.addEventListener("click", quickUnbanLeaderboardPlayer);
            document.getElementById("quick-leaderboard-ban-username")?.addEventListener("change", (event) => {
                if (event.target.value) showPlayer(event.target.value);
            });
        });
    </script>
</body>
</html>
