        <img src="Im just a chill guy no background.png" height="100px">

    <main>
        <div class="main">
            <div class="display">
                <h3>Character</h3>
                <div class="display-character">
                    <img src="Im just a chill guy no background.png">
                </div>
                <div class="stats">
                    <p>Damage: <span id="equipped-damage">0</span></p>
                    <p>Health: <span id="equipped-defense">0</span></p>
                </div>
                <div class="character-items">
                    <div class="border" id="equip-slot-0" title="Click item to equip"></div>
                    <div class="border" id="equip-slot-1" title="Click item to equip"></div>
                    <div class="border" id="equip-slot-2" title="Click item to equip"></div>
                    <div class="border" id="equip-slot-3" title="Click item to equip"></div>
                    <div class="border" id="equip-slot-4" title="Click item to equip"></div>
                </div>
            </div>
            <div class="list-items">
                <div>
                    <h3>Items</h3>
                </div>
                <div class="item"><img src="Im just a chill guy no background.png" height="50px"></div>
                <div id="exchange-panel" style="margin-top:18px; padding:10px; border-top:1px solid #ccc;">
                    <h3>Exchange</h3>
                    <div id="exchange-list"></div>
                    <p id="exchange-msg" style="color:green; margin-top:8px;"></p>
                </div>
