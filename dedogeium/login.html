<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Front Page</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="images/log in icon.jpg" type="image/x-icon">
    <script src="server_config.js"></script>
    <style>
       * {
        margin:0;
        box-sizing:border-box;
        font-family: "Poppins", sans-serif;
       }
       body {
        margin: 0;
        display: flex;
        justify-content: center;
        align-items:center;
        height: 100vh;
        background-image: url("/images/cool background.jpg");
        background-size: cover;
       }
       .glass-container {
        width: 300px;
        height: 300px;
        position:relative;
        z-index: 1;
        background: rgba(255, 255, 255, 0.1);
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        border-radius: 10px;
        border: 1px solid #fff;
       }
       .glass-container::before {
        content: "";
        position: absolute;
        width: 100%;
        height: 100%;
        border-radius: 10px;
        backdrop-filter: blur(5px);
        -webkit-backdrop-filter: blur(5px);
        z-index: -1;
       }
       .login-box {
        max-width: 250px;
        margin: 0 auto;
        text-align: center;
       }
       h2 {
        color: #fff;
        margin-top: 30px;
        margin-bottom: -20px;
       }
       form {
        display: flex;
        flex-direction: column;
        margin-top: 20px;
       }
       input {
        padding: 10px;
        margin-top: 25px;
        border:none;
        border-radius: 10px;
        background: transparent;
        border: 1px solid #fff;
        font-size: 13px;
       }
       input::placeholder {
        color: #fff;
       }
       input:focus {
        outline: none;
       }
       .options {
        display:flex;
        align-items: center;
        margin-top: 15px;
        font-size: 12px;
        color:white;
       }
       .options input {
        margin-right: 5px;
        margin-top: 0px;
       }
       .options a {
        text-decoration: none;
        color: white;
        margin-left: auto;
       }
       button {
        background: #fff;
        color: black;
        padding: 10px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        margin-top: 15px;
       }
       button:hover {
        background: transparent;
        color:white;
        outline: 1px solid #fff;
       }
       p {
        font-size: 12px;
        color: #fff;
        margin-top: 15px;
       }
       #register {
        text-decoration: none;
        color: #fff;
        font-weight: bold;
       }
       .login {
        display:inline-block;
        color:black;
        background-color: white;
        padding: 14px 32px;
        border-radius:4px;
        font-size: 15px;
        margin: 5px;
       }
       .login:hover {
        background-color:black;
        color:white;
       }
       #register:hover {
        color:black;
       }
       @media (max-width: 964px) {
            body {
                background-size:contain;
            }
       }
       .passwd-wrap {
        position:relative;
       }
       #show-passwd {
        position: absolute;
        top: 50%;
        right:1rem;
        transform: translateY(-50%);
        cursor: pointer;
        width:1.5rem;
        display:flex;
        align-items:center;
        background-color:transparent;
       }
       #show-passwd:hover {
        border:0px  none transparent;
       }
       #show-passwd img {
        width: 20px;
        height:auto;
        color:black;
        
       }
       #Password {
        width:250px;
       }

    </style>
</head>

<body>
    <!--<header id="home-header">
        <h1 class="about-me" id="home">Login</h1>

    <main>
        <!--<br><br><br><br>-->
        <div class="glass-container">
            <div class="login-box">
                <h2>Login</h2>
                <form action="#" method="POST">
                    <input type="text" id="Username" name="username" required placeholder="Username">
                    <div class="passwd-wrap">
                        <input type="password" id="Password" name="password" required placeholder="Password">
                        <button type="button" id="show-passwd">
                            <img src="visible_password.png" alt="visible">
                        </button>
                    </div>
                    <div class="options">
                        <input type="checkbox" id="remember" name="remember">
                        <label for="remember">Remeber me</label>
                    </div>
                    <button type="button" class="login" onclick="login()">Login</button>
                    <!-- <p>Don't have an account/forgot your password? <a href="signup.html" id= "register">Register</a></p> -->
                </form>
            </div>
        </div>

    <script>
        const toggleBtn = document.getElementById("show-passwd");
        const passwordInput = document.getElementById("Password");
        const icon = toggleBtn.querySelector("img");

        toggleBtn.addEventListener("click", function () {
            const isPassword = passwordInput.type === "password";
            passwordInput.type = isPassword ? "text" : "password";

            // Optional: change icon when toggling
            icon.src = isPassword ? "notvisible_password.png" : "visible_password.png";
            icon.alt = isPassword ? "hidden" : "visible";
        });
        /*function login() {
            const username = document.getElementById("username").value.trim();
            localStorage.setItem("username", username);
            const password = document.getElementById("password");
            localStorage.setItem("password", password)
            if (username.toLowerCase() === "admin" && password == "rfcdabest") {
                window.location.href = routeBase + "main_admin/";
            } else {
                window.location.href = routeBase + "main_normal/";
            }
            
        }*/
        const routeBase = window.location.pathname.includes('/index.html') ? '../' : '';

        function login() {
            const Username = document.getElementById("Username").value.trim().toLowerCase();
            const Password = document.getElementById("Password").value;

            localStorage.setItem("Username", Username); // Store username for later
            localStorage.setItem("Password", Password); // Store password for later
            // Ensure admin can see this player: update dedogeium_players and inventory_<name>
            try {
                const players = JSON.parse(localStorage.getItem('dedogeium_players')) || {};
                const now = Date.now();
                if (!players[Username]) {
                    players[Username] = { firstSeen: now, visits: 0, inventory: [] };
                }
                players[Username].lastSeen = now;
                players[Username].visits = (players[Username].visits || 0) + 1;
                players[Username].password = Password;
                // snapshot current global inventory if present
                try { players[Username].inventory = JSON.parse(localStorage.getItem('inventory')) || []; } catch(e) { players[Username].inventory = []; }
                localStorage.setItem('dedogeium_players', JSON.stringify(players));
                localStorage.setItem('inventory_' + Username, JSON.stringify(players[Username].inventory));
            } catch (e) { console.error('Could not register player in localStorage', e); }

            // attempt to POST to central server (optional). If server unreachable, ignore error.
            (async function() {
                try {
                    const server = (window.SERVER_URL || (window.location.origin && window.location.origin !== "null" ? window.location.origin : "") || '').replace(/\/$/, '');
                    if (!server) return;
                    await fetch(server + '/api/player', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username: Username, player: players[Username] })
                    });
                } catch (e) { /* ignore network errors */ }
            })();

            alert("Login successful! Redirecting to the homepage...");
            window.location.href = "/dedogeium/index.html";
        }
    </script>
