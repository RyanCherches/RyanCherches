<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="../">
    <title>Front Page</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="images/log in icon.jpg" type="image/x-icon">
    <script src="server_defaults.js"></script>
    <script src="server_config.js"></script>
    <style>
       * {
        margin:0;
        box-sizing:border-box;
        font-family: "Poppins", sans-serif;
       }
       body {
        margin: 0;
        display: flex;
        justify-content: center;
        align-items:center;
        height: 100vh;
        background-image: url("/images/cool background.jpg");
        background-size: cover;
       }
       .glass-container {
        width: 300px;
        height: 390px;
        position:relative;
        z-index: 1;
        background: rgba(255, 255, 255, 0.1);
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        border-radius: 10px;
        border: 1px solid #fff;
       }
       .glass-container::before {
        content: "";
        position: absolute;
        width: 100%;
        height: 100%;
        border-radius: 10px;
        backdrop-filter: blur(5px);
        -webkit-backdrop-filter: blur(5px);
        z-index: -1;
       }
       .login-box {
        max-width: 250px;
        margin: 0 auto;
        text-align: center;
       }
       h2 {
        color: #fff;
        margin-top: 30px;
        margin-bottom: -20px;
       }
       form {
        display: flex;
        flex-direction: column;
        margin-top: 20px;
       }
       input {
        padding: 10px;
        margin-top: 25px;
        border:none;
        border-radius: 10px;
        background: transparent;
        border: 1px solid #fff;
        font-size: 13px;
       }
       input::placeholder {
        color: #fff;
       }
       input:focus {
        outline: none;
       }
       .options {
        display:flex;
        align-items: center;
        margin-top: 15px;
        font-size: 12px;
        color:white;
       }
       .options input {
        margin-right: 5px;
        margin-top: 0px;
       }
       .options a {
        text-decoration: none;
        color: white;
        margin-left: auto;
       }
       button {
        background: #fff;
        color: black;
        padding: 10px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        margin-top: 15px;
       }
       button:hover {
        background: transparent;
        color:white;
        outline: 1px solid #fff;
       }
       p {
        font-size: 12px;
        color: #fff;
        margin-top: 15px;
       }
       #register {
        text-decoration: none;
        color: #fff;
        font-weight: bold;
       }
       .login {
        display:inline-block;
        color:black;
        background-color: white;
        padding: 14px 32px;
        border-radius:4px;
        font-size: 15px;
        margin: 5px;
       }
       .login:hover {
        background-color:black;
        color:white;
       }
       .secondary-action {
        background: transparent;
        color: white;
        outline: 1px solid #fff;
       }
       .secondary-action:hover {
        background: rgba(255, 255, 255, 0.12);
        color: white;
       }
       .auth-actions {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-top: 10px;
       }
       .auth-status {
        min-height: 34px;
        color: #fff;
        font-size: 12px;
        line-height: 1.4;
       }
       .server-wrap {
        margin-top: 12px;
        text-align: left;
       }
       .server-wrap label {
        display: block;
        color: #fff;
        font-size: 12px;
        margin-bottom: 6px;
       }
       .server-wrap input {
        margin-top: 0;
        width: 100%;
       }
       #register:hover {
        color:black;
       }
       @media (max-width: 964px) {
            body {
                background-size:contain;
            }
       }
       .passwd-wrap {
        position:relative;
       }
       #show-passwd {
        position: absolute;
        top: 50%;
        right:1rem;
        transform: translateY(-50%);
        cursor: pointer;
        width:1.5rem;
        display:flex;
        align-items:center;
        background-color:transparent;
       }
       #show-passwd:hover {
        border:0px  none transparent;
       }
       #show-passwd img {
        width: 20px;
        height:auto;
        color:black;
        
       }
       #Password {
        width:250px;
       }

    </style>
</head>

<body>
    <!--<header id="home-header">
        <h1 class="about-me" id="home">Login</h1>
    </header>-->
    <main>
        <!--<br><br><br><br>-->
        <div class="glass-container">
            <div class="login-box">
                <h2>Login</h2>
                <form action="#" method="POST">
                    <input type="text" id="Username" name="username" required placeholder="Username">
                    <div class="passwd-wrap">
                        <input type="password" id="Password" name="password" required placeholder="Password">
                        <button type="button" id="show-passwd">
                            <img src="visible_password.png" alt="visible">
                        </button>
                    </div>
                    <div class="options">
                        <input type="checkbox" id="remember" name="remember">
                        <label for="remember">Remeber me</label>
                    </div>
                    <div class="server-wrap">
                        <label for="server-url-input">Server URL (optional)</label>
                        <input type="text" id="server-url-input" placeholder="Auto-detect, or enter http://127.0.0.1:3000">
                    </div>
                    <div class="auth-actions">
                        <button type="submit" class="login">Login</button>
                        <button type="button" id="register-btn" class="login secondary-action">Create Account</button>
                    </div>
                    <p class="auth-status" id="auth-status">Use the same username and password on every device if you want to keep one shared leaderboard account.</p>
                </form>
            </div>
        </div>

    <script>
        const toggleBtn = document.getElementById("show-passwd");
        const passwordInput = document.getElementById("Password");
        const icon = toggleBtn.querySelector("img");
        const authForm = document.querySelector("form");
        const registerBtn = document.getElementById("register-btn");
        const authStatus = document.getElementById("auth-status");
        const serverUrlInput = document.getElementById("server-url-input");
        const AUTH_TOKEN_STORAGE_KEY = "dedogeiumAuthToken";
        const USERNAME_KEYS = ["Username", "Uabcd", "username", "playerName"];
        const PASSWORD_KEYS = ["Password", "Pabc", "password", "pass", "pwd"];
        const requestedNext = new URLSearchParams(window.location.search).get("next");

        toggleBtn.addEventListener("click", function () {
            const isPassword = passwordInput.type === "password";
            passwordInput.type = isPassword ? "text" : "password";

            // Optional: change icon when toggling
            icon.src = isPassword ? "notvisible_password.png" : "visible_password.png";
            icon.alt = isPassword ? "hidden" : "visible";
        });
        function setStatus(message, isError = false) {
            if (!authStatus) return;
            authStatus.textContent = message;
            authStatus.style.color = isError ? "#ffd5d5" : "#fff";
        }

        function normalizeServerUrl(value) {
            const trimmed = String(value || "").trim();
            if (!trimmed) return "";
            const withProtocol = /^https?:\/\//i.test(trimmed) ? trimmed : `http://${trimmed}`;
            try {
                const parsed = new URL(withProtocol);
                const normalizedPath = parsed.pathname && parsed.pathname !== "/"
                    ? parsed.pathname.replace(/\/+$/, "")
                    : "";
                return `${parsed.protocol}//${parsed.host}${normalizedPath}`;
            } catch (error) {
                return "";
            }
        }

        function buildApiBaseCandidates(serverBase) {
            const normalized = normalizeServerUrl(serverBase);
            if (!normalized) return [];
            try {
                const parsed = new URL(normalized);
                const path = parsed.pathname && parsed.pathname !== "/"
                    ? parsed.pathname.replace(/\/+$/, "")
                    : "";
                return Array.from(new Set([
                    `${parsed.origin}${path}/api`,
                    `${parsed.origin}/api`,
                ]));
            } catch (error) {
                return [`${normalized}/api`];
            }
        }

        function getSavedServerBase() {
            const allowOriginServer = typeof window.DEDOGEIUM_ALLOW_ORIGIN_SERVER === "boolean"
                ? window.DEDOGEIUM_ALLOW_ORIGIN_SERVER
                : true;
            const originServer = allowOriginServer && window.location.origin && window.location.origin !== "null"
                ? window.location.origin
                : "";
            const storageKey = window.DEDOGEIUM_SERVER_STORAGE_KEY || "dedogeiumServerUrl";
            return normalizeServerUrl(window.SERVER_URL || localStorage.getItem(storageKey) || window.DEDOGEIUM_SITE_SERVER_BASE || originServer || "");
        }

        function getServerCandidates(preferredServer) {
            const storageKey = window.DEDOGEIUM_SERVER_STORAGE_KEY || "dedogeiumServerUrl";
            const allowOriginServer = typeof window.DEDOGEIUM_ALLOW_ORIGIN_SERVER === "boolean"
                ? window.DEDOGEIUM_ALLOW_ORIGIN_SERVER
                : true;
            const originServer = allowOriginServer && window.location.origin && window.location.origin !== "null"
                ? window.location.origin
                : "";
            const candidates = [
                preferredServer,
                window.SERVER_URL,
                localStorage.getItem(storageKey),
                ...(Array.isArray(window.DEDOGEIUM_SERVER_CANDIDATES) ? window.DEDOGEIUM_SERVER_CANDIDATES : []),
                window.DEDOGEIUM_SITE_SERVER_BASE || "",
                originServer,
                "http://127.0.0.1:3000",
                "http://localhost:3000",
                "http://127.0.0.1:5000",
                "http://localhost:5000",
            ]
                .map(normalizeServerUrl)
                .filter(Boolean);
            return Array.from(new Set(candidates));
        }

        async function findWorkingApiBase(preferredServer) {
            const storageKey = window.DEDOGEIUM_SERVER_STORAGE_KEY || "dedogeiumServerUrl";
            const attempts = [];
            for (const serverBase of getServerCandidates(preferredServer)) {
                for (const apiBase of buildApiBaseCandidates(serverBase)) {
                    try {
                        const response = await fetch(`${apiBase}/health`);
                        const data = await response.json().catch(() => ({}));
                        if (response.ok && data && data.ok) {
                            localStorage.setItem(storageKey, serverBase);
                            window.SERVER_URL = serverBase;
                            if (serverUrlInput) serverUrlInput.value = serverBase;
                            return { apiBase, serverBase };
                        }
                        attempts.push(`${apiBase}/health -> ${response.status}`);
                    } catch (error) {
                        attempts.push(`${apiBase}/health -> network error`);
                    }
                }
            }

            throw new Error(`No Dedogeium server responded. Tried: ${attempts.join(" | ")}`);
        }

        function persistUsername(username) {
            USERNAME_KEYS.forEach((key) => {
                localStorage.setItem(key, username);
            });
        }

        function clearStoredPasswords() {
            PASSWORD_KEYS.forEach((key) => {
                localStorage.removeItem(key);
            });
        }

        function getPostLoginTarget() {
            if (!requestedNext) return "home/";
            if (/^[a-z]+:\/\//i.test(requestedNext)) return "home/";
            if (requestedNext.startsWith("//")) return "home/";
            return requestedNext;
        }

        function primeLocalPlayerRecord(username) {
            try {
                const players = JSON.parse(localStorage.getItem("dedogeium_players") || "{}");
                const now = Date.now();
                if (!players[username]) {
                    players[username] = { firstSeen: now, visits: 0, inventory: [] };
                }
                players[username].firstSeen = players[username].firstSeen || now;
                players[username].lastSeen = now;
                players[username].visits = Math.max(1, Number(players[username].visits) || 0);
                try {
                    players[username].inventory = JSON.parse(localStorage.getItem("inventory")) || [];
                } catch (error) {
                    players[username].inventory = [];
                }
                localStorage.setItem("dedogeium_players", JSON.stringify(players));
                localStorage.setItem(`inventory_${username}`, JSON.stringify(players[username].inventory));
            } catch (error) {
                console.error("Could not update local player cache", error);
            }
        }

        function readLocalPlayers() {
            try {
                const players = JSON.parse(localStorage.getItem("dedogeium_players") || "{}");
                return players && typeof players === "object" ? players : {};
            } catch (error) {
                return {};
            }
        }

        function writeLocalPlayers(players) {
            localStorage.setItem("dedogeium_players", JSON.stringify(players || {}));
        }

        function createLocalAuthToken(username) {
            return `local_${username}_${Date.now()}_${Math.random().toString(36).slice(2, 10)}`;
        }

        function isServerLookupFailure(error) {
            const message = error && error.message ? String(error.message) : "";
            return message.startsWith("No Dedogeium server responded.");
        }

        function handleLocalAuth(mode, username, password) {
            const players = readLocalPlayers();
            const existing = players[username] && typeof players[username] === "object" ? players[username] : null;
            const now = Date.now();

            if (mode === "register") {
                if (existing && typeof existing.password === "string" && existing.password) {
                    throw new Error("That local username is already taken on this device.");
                }
                players[username] = {
                    ...(existing || {}),
                    password,
                    firstSeen: existing && existing.firstSeen ? existing.firstSeen : now,
                    lastSeen: now,
                    visits: Math.max(1, Number(existing && existing.visits) || 0),
                };
                writeLocalPlayers(players);
                return {
                    ok: true,
                    username,
                    token: createLocalAuthToken(username),
                    localOnly: true,
                };
            }

            if (!existing || !existing.password) {
                throw new Error("No local account with that username exists on this device. Create one first or start the Dedogeium server.");
            }
            if (String(existing.password) !== String(password)) {
                throw new Error("Incorrect local password for that device account.");
            }

            players[username] = {
                ...existing,
                lastSeen: now,
                visits: Math.max(1, Number(existing.visits) || 0),
            };
            writeLocalPlayers(players);
            return {
                ok: true,
                username,
                token: createLocalAuthToken(username),
                localOnly: true,
            };
        }

        async function sendAuthRequest(pathname, payload) {
            const preferredServer = serverUrlInput ? serverUrlInput.value : "";
            const { apiBase } = await findWorkingApiBase(preferredServer);
            const response = await fetch(`${apiBase}${pathname}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload),
            });
            const data = await response.json().catch(() => ({}));
            if (response.ok && data && data.ok) {
                return data;
            }
            throw new Error(data && data.error ? data.error : "The Dedogeium server rejected the login request.");
        }

        async function submitAuth(mode) {
            const username = document.getElementById("Username").value.trim().toLowerCase();
            const password = document.getElementById("Password").value;
            if (!username || !password) {
                setStatus("Enter both a username and password first.", true);
                return;
            }

            setStatus(mode === "register" ? "Creating account..." : "Logging in...");
            try {
                let payload;
                try {
                    payload = await sendAuthRequest(mode === "register" ? "/auth/register" : "/auth/login", {
                        username,
                        password,
                    });
                } catch (error) {
                    if (!isServerLookupFailure(error)) {
                        throw error;
                    }
                    payload = handleLocalAuth(mode, username, password);
                }
                persistUsername(payload.username);
                localStorage.setItem(AUTH_TOKEN_STORAGE_KEY, payload.token);
                clearStoredPasswords();
                primeLocalPlayerRecord(payload.username);
                if (payload.localOnly) {
                    setStatus(mode === "register"
                        ? "Local-only account created on this device. Redirecting..."
                        : "Logged in with this device's local account. Redirecting...");
                } else {
                    setStatus(mode === "register" ? "Account created. Redirecting..." : "Login successful. Redirecting...");
                }
                window.location.href = getPostLoginTarget();
            } catch (error) {
                setStatus(error && error.message ? error.message : "Login failed.", true);
            }
        }

        authForm.addEventListener("submit", (event) => {
            event.preventDefault();
            submitAuth("login");
        });

        registerBtn.addEventListener("click", () => {
            submitAuth("register");
        });

        if (serverUrlInput) {
            serverUrlInput.value = getSavedServerBase();
        }
    </script>
</body>
