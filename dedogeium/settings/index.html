<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="../">
    <title>Settings</title>
    <link rel="stylesheet" href="settings.css">
</head>
<body>
    <header>
        <h1><a href="home/" class="animation">Dedogeium</a></h1>
        <h1><a href="customize/" class="animation">Customize</a></h1>
        <h1><a href="skills/" class="animation">Skills</a></h1>
        <h1><a href="adventure/" class="animation">Adventure</a></h1>
        <h1><a href="updates/" class="animation">Updates</a></h1>
        <h1><a href="settings/" class="animation">Settings</a></h1>
    </header>
    <main>
        <div id="mainBox">
            <h1>Settings</h1>
            <p>Here you can change the settings of the game, such as the music volume, and the sound effects volume.</p>
            <label for="music-volume">Music Volume: <span id="music-volume-value">50%</span></label>
            <input type="range" id="music-volume" name="music-volume" min="0" max="100" value="50">
            <div class="volume-actions">
                <button id="test-music-btn" type="button">Play Music</button>
                <button id="test-sound-btn" type="button">Test Sound</button>
            </div>
            <label for="skip-all-dialogue" class="settings-toggle">
                <input type="checkbox" id="skip-all-dialogue">
                <span>Skip all level dialogue automatically</span>
            </label>
            <p id="skip-all-dialogue-status" class="settings-status"></p>
            <label for="spoken-dialogue" class="settings-toggle">
                <input type="checkbox" id="spoken-dialogue">
                <span>Read dialogue out loud with character voices</span>
            </label>
            <p id="spoken-dialogue-status" class="settings-status"></p>
            <label for="split-background" class="settings-toggle">
                <input type="checkbox" id="split-background">
                <span>Enable split background effect (blue/red with color switching)</span>
            </label>
            <p id="split-background-status" class="settings-status"></p>
            <div class="title-settings">
                <h2>Player Title</h2>
                <label for="player-title-input">Choose a title:</label>
                <select id="player-title-input">
                    <option value="">Select a title</option>
                    <option value="Fresh Arena Fighter">Fresh Arena Fighter</option>
                    <option value="Geared Arena Fighter">Geared Arena Fighter</option>
                    <option value="early gang">early gang</option>
                    <option value="admin">admin</option>
                    <option value="Arena Champion">Arena Champion</option>
                </select>
                <button id="save-player-title" type="button">Save Title</button>
                <p id="player-title-feedback" class="settings-status"></p>
            </div>
            <br><br>
        </div>
    </main>
    <script>
        function getCurrentUsername() {
            const keys = ["Username", "Uabcd", "username", "playerName"];
            for (const key of keys) {
                const value = localStorage.getItem(key);
                if (value) return String(value).trim().toLowerCase();
            }
            return "";
        }

        function getStoredTitle(username) {
            if (!username) return "";
            try {
                const players = JSON.parse(localStorage.getItem("dedogeium_players") || "{}");
                return (players[username] && players[username].title) || "";
            } catch (error) {
                return "";
            }
        }

        function saveStoredTitle(username, title) {
            if (!username) return;
            try {
                const players = JSON.parse(localStorage.getItem("dedogeium_players") || "{}");
                if (!players[username]) players[username] = {};
                players[username].title = title;
                localStorage.setItem("dedogeium_players", JSON.stringify(players));
            } catch (error) {
                // ignore
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            const titleInput = document.getElementById("player-title-input");
            const saveButton = document.getElementById("save-player-title");
            const feedback = document.getElementById("player-title-feedback");
            const username = getCurrentUsername();
            if (username && titleInput) {
                titleInput.value = getStoredTitle(username);
            }
            if (saveButton) {
                saveButton.addEventListener("click", () => {
                    const title = normalizePlayerTitle(titleInput.value);
                    if (!username) {
                        feedback.textContent = "Log in first to save your title.";
                        return;
                    }
                    if (!title) {
                        feedback.textContent = "Enter a title before saving.";
                        return;
                    }
                    saveStoredTitle(username, title);
                    feedback.textContent = `Title saved: ${title}`;
                });
            }

            // Split background toggle
            const splitBgCheckbox = document.getElementById("split-background");
            const splitBgStatus = document.getElementById("split-background-status");
            const SPLIT_BG_KEY = "splitBackgroundEnabled";

            function updateSplitBgStatus(enabled) {
                if (!splitBgStatus) return;
                splitBgStatus.textContent = enabled
                    ? "Split background effect is on. Half blue, half red with color switching."
                    : "Split background effect is off.";
            }

            const splitBgEnabled = localStorage.getItem(SPLIT_BG_KEY) === "true";
            if (splitBgCheckbox) {
                splitBgCheckbox.checked = splitBgEnabled;
            }
            updateSplitBgStatus(splitBgEnabled);

            if (splitBgCheckbox) {
                splitBgCheckbox.addEventListener("change", () => {
                    const enabled = splitBgCheckbox.checked;
                    localStorage.setItem(SPLIT_BG_KEY, String(enabled));
                    updateSplitBgStatus(enabled);
                });
            }
        });
    </script>
</body>
</html>
