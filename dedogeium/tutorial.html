<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tutorial</title>
    <link rel="stylesheet" href="tutorial.css">
</head>
<body>
    <div id="game" width="100vw">
        <img src="crystal attack.png"  id="crystal_attack" width="100px" style="display:none;">
        <div class="character-wrap">
            <img src="spotlight.png" style="display:none;" id="spotlight">
            <img src="Im just a chill guy no background.png" style="display:none;" id="main-character">
            <p id="hlth" style="display:none;">sdfgf</p>
        </div>
        <p class="white" id="speech-good" style="display:none;"></p>
        <div id="yes-no" style="display:none;">
            <div>
                <p style="display:none;">Do you wan't to play</p>
            </div>
            <div id="btns">
                <button id="ok-btn" style="display:none;">OK</button>
                <button id="cancel-btn" style="display:none;">Cancel</button>
            </div>
        </div>
        <!-- skip button shown during the cutscene to advance lines -->
        <button id="skip-btn" style="display:none;">Next</button>
        <div id="victory">
            <p id="maybe-vic" style="display:none;"></p>
            <button id="bye-btn" style="display:none;">Go back</button>
        </div>
        <p class="white" id="speech-bad" style="display:none;"></p>
        <div class="character-wrap">
            <img src="Im just a chill guy no background.png" width="102px" style="display:none;" id="enemy-character">
            <img src="spotlight.png" style="display:none;" id="spotlight2">
            <p id="enemy-hlth" style="display:none;">dfsg</p>
        </div>
    </div>
<script src="tutorial.js"></script>
</body>
</html>
</body>
</html>
