<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doge Business - Payment</title>
    <link rel="stylesheet" href="payement.css">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/build/email.min.js"></script>
</head>
<body>
    <div class="payment-container">
        <div class="payment-header">
            <h1>Payment</h1>
            <p>Complete your purchase</p>
        </div>

        <div class="payment-content">
            <!-- Products Section -->
            <div class="products-section">
                <h2>Select Products</h2>
                <div class="products-list">
                    <div class="put_name product-checkbox">
                        <input name ="first and last name" type="text" placeholder="Please put your first and last name" required>
                    </div>
                    <div class="product-item" data-price="10.00" data-name="Blue Doge">
                        
                        <div class="product-checkbox">
                            <input type="checkbox" id="blueDoge" name="blueDoge" value="10.00">
                        </div>
                        <div class="product-info">
                            <label for="blueDoge">Blue Doge</label>
                            <span class="product-price">$10.00</span>
                        </div>
                    </div>
                    <div class="product-item" data-price="15.00" data-name="Green Doge">
                        <div class="product-checkbox">
                            <input type="checkbox" id="greenDoge" name="greenDoge" value="15.00">
                        </div>
                        <div class="product-info">
                            <label for="greenDoge">Green Doge</label>
                            <span class="product-price">$15.00</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Order Summary -->
            <div class="order-summary">
                <h2>Order Summary</h2>
                <div id="selectedItems"></div>
                <div class="order-item">
                    <span>Subtotal</span>
                    <span id="subtotal">$0.00</span>
                </div>
                <div class="order-item">
                    <span>Shipping</span>
                    <span>$5.00</span>
                </div>
                <div class="order-divider"></div>
                <div class="order-total">
                    <span>Total</span>
                    <span id="totalPrice">$5.00</span>
                </div>
            </div>

            <!-- Payment Form -->
            <form class="payment-form" id="paymentForm">
                <!-- Submit Button -->
                 
                <button type="submit" class="payment-button">Complete Payment</button>
                <a href="index.html" class="cancel-button">Cancel</a>
            </form>
        </div>
    </div>

    <script src="payement.js"></script>
</body>
</html>
