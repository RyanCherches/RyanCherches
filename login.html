<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Front Page</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="images/log in icon.jpg" type="image/x-icon">
    <style>
       * {
        margin:0;
        box-sizing:border-box;
        font-family: "Poppins", sans-serif;
       }
       body {
        margin: 0;
        display: flex;
        justify-content: center;
        align-items:center;
        height: 100vh;
        background-image: url("images/cool\ background.jpg");
        background-size: cover;
       }
       .glass-container {
        width: 300px;
        height: 390px;
        position:relative;
        z-index: 1;
        background: rgba(255, 255, 255, 0.1);
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        border-radius: 10px;
        border: 1px solid #fff;
       }
       .glass-container::before {
        content: "";
        position: absolute;
        width: 100%;
        height: 100%;
        border-radius: 10px;
        backdrop-filter: blur(5px);
        -webkit-backdrop-filter: blur(5px);
        z-index: -1;
       }
       .login-box {
        max-width: 250px;
        margin: 0 auto;
        text-align: center;
       }
       h2 {
        color: #fff;
        margin-top: 30px;
        margin-bottom: -20px;
       }
       form {
        display: flex;
        flex-direction: column;
        margin-top: 20px;
       }
       input {
        padding: 10px;
        margin-top: 25px;
        border:none;
        border-radius: 10px;
        background: transparent;
        border: 1px solid #fff;
        font-size: 13px;
       }
       input::placeholder {
        color: #fff;
       }
       input:focus {
        outline: none;
       }
       .options {
        display:flex;
        align-items: center;
        margin-top: 15px;
        font-size: 12px;
        color:white;
       }
       .options input {
        margin-right: 5px;
        margin-top: 0px;
       }
       .options a {
        text-decoration: none;
        color: white;
        margin-left: auto;
       }
       button {
        background: #fff;
        color: black;
        padding: 10px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        margin-top: 15px;
       }
       button:hover {
        background: transparent;
        color:white;
        outline: 1px solid #fff;
       }
       p {
        font-size: 12px;
        color: #fff;
        margin-top: 15px;
       }
       #register {
        text-decoration: none;
        color: #fff;
        font-weight: bold;
       }
       .login {
        display:inline-block;
        color:black;
        background-color: white;
        padding: 14px 32px;
        border-radius:4px;
        font-size: 15px;
        margin: 5px;
       }
       .login:hover {
        background-color:black;
        color:white;
       }
       .secondary-action {
        background: transparent;
        color: white;
        outline: 1px solid #fff;
       }
       .secondary-action:hover {
        background: rgba(255, 255, 255, 0.12);
        color: white;
       }
       .auth-actions {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-top: 10px;
       }
       .auth-status {
        min-height: 34px;
        color: #fff;
        font-size: 12px;
        line-height: 1.4;
       }
       #register:hover {
        color:black;
       }
       @media (max-width: 964px) {
            body {
                background-size:contain;
            }
       }
       .passwd-wrap {
        position:relative;
       }
       #show-passwd {
        position: absolute;
        top: 50%;
        right:1rem;
        transform: translateY(-50%);
        cursor: pointer;
        width:1.5rem;
        display:flex;
        align-items:center;
        background-color:transparent;
       }
       #show-passwd:hover {
        border:0px  none transparent;
       }
       #show-passwd img {
        width: 20px;
        height:auto;
        color:black;
        
       }
       #Pabc {
        width:250px;
       }

    </style>
</head>

<body>
    <!--<header id="home-header">
        <h1 class="about-me" id="home">Login</h1>
    </header>-->
    <main>
        <!--<br><br><br><br>-->
        <div class="glass-container">
            <div class="login-box">
                <h2>Login</h2>
                <form action="#" method="POST">
                    <input type="text" id="Uabcd" name="username" required placeholder="Username">
                    <div class="passwd-wrap">
                        <input type="password" id="Pabc" name="password" required placeholder="Password">
                        <button type="button" id="show-passwd">
                            <img src="images/visible_password.png" alt="visible">
                        </button>
                    </div>
                    <div class="options">
                        <input type="checkbox" id="remember" name="remember">
                        <label for="remember">Remeber me</label>
                    </div>
                    <div class="auth-actions">
                        <button type="submit" class="login">Login</button>
                        <button type="button" id="register-btn" class="login secondary-action">Register</button>
                    </div>
                    <p class="auth-status" id="auth-status">This login is only for the main RyanCherches site. Dedogeium uses its own separate login page.</p>
                </form>
            </div>
        </div>
        <!--<footer class="main__footer">
            <div class="footer1">
                <h2 id="footer-text">Front Page</h2>
            </div>
            <div class="footer2">
                <p>This website was made with the help of Kodland. Kodland is a company that helps young learners(like me) learn coding languages very easily. 
                </p>
                <div class="footer_links">
                    <a href="https://www.kodland.org/" target="_blank">The link to Kodland</a>
                    <a href="mailto:rfcherches13@gmail.com">rfcherches13@gmail.com</a>
                    </div>
                </div>
            </footer>-->
    <script>
        const toggleBtn = document.getElementById("show-passwd");
        const passwordInput = document.getElementById("Pabc");
        const icon = toggleBtn.querySelector("img");
        const authForm = document.querySelector("form");
        const registerBtn = document.getElementById("register-btn");
        const authStatus = document.getElementById("auth-status");
        const USERNAME_KEYS = ["Username", "Uabcd", "username", "playerName"];

        toggleBtn.addEventListener("click", function () {
            const isPassword = passwordInput.type === "password";
            passwordInput.type = isPassword ? "text" : "password";

            // Optional: change icon when toggling
            icon.src = isPassword ? "images/notvisible_password.png" : "images/visible_password.png";
            icon.alt = isPassword ? "hidden" : "visible";
        });
        function setStatus(message, isError = false) {
            if (!authStatus) return;
            authStatus.textContent = message;
            authStatus.style.color = isError ? "#ffd5d5" : "#fff";
        }

        function persistUsername(username) {
            USERNAME_KEYS.forEach((key) => {
                localStorage.setItem(key, username);
            });
        }

        function loginMainSite() {
            const username = document.getElementById("Uabcd").value.trim().toLowerCase();
            const password = document.getElementById("Pabc").value;

            if (!username || !password) {
                setStatus("Enter both a username and password first.", true);
                return;
            }

            persistUsername(username);

            if (username === "admin" && password === "rfc51813") {
                window.location.href = "main_admin.html";
                return;
            }
            if (username === "advisor" && password === "rfcthebest") {
                window.location.href = "main_advisor.html";
                return;
            }
            if (username === "family" && password === "rfcthebest") {
                window.location.href = "main_advisor.html";
                return;
            }
            if (username === "diana" && password === "rfcthebest") {
                window.location.href = "main_tutor.html";
                return;
            }
            if (username === "friend" && password === "rfcthebest") {
                window.location.href = "main_friend.html";
                return;
            }
            if (username === "business" && password === "business") {
                window.location.href = "business_main.html";
                return;
            }

            setStatus("Login successful. Redirecting...", false);
            window.location.href = "index.html";
        }

        authForm.addEventListener("submit", function (event) {
            event.preventDefault();
            loginMainSite();
        });

        registerBtn.addEventListener("click", function () {
            window.location.href = "signup.html";
        });
    </script>
</body>
</html>
