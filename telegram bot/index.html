<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Message Creator</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body{
    font-family:Arial;
    background:#f4f6fb;
    text-align:center;
    margin:0;
}

header{
    background:#0088cc;
    color:white;
    padding:20px;
    font-size:26px;
}

.container{
    margin-top:30px;
}

input, select{
    padding:10px;
    margin:10px;
    width:220px;
    border-radius:8px;
    border:1px solid #ccc;
}

button{
    padding:12px 20px;
    margin:10px;
    border:none;
    border-radius:10px;
    background:#0088cc;
    color:white;
    cursor:pointer;
}

.preview{
    margin-top:30px;
    padding:20px;
    border-radius:10px;
    background:white;
    display:inline-block;
    min-width:200px;
}

.bounce{
    animation:bounce 1s infinite;
}

@keyframes bounce{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-10px);}
}

.glow{
    text-shadow:0 0 10px currentColor;
}

.big{
    font-size:30px;
}

</style>
</head>

<body>

<header>Custom Message Creator</header>

<div class="container">

<input id="message" placeholder="Type your message">

<br>

<select id="color">
<option value="black">Black</option>
<option value="red">Red</option>
<option value="blue">Blue</option>
<option value="green">Green</option>
<option value="purple">Purple</option>
</select>

<select id="effect">
<option value="">No Effect</option>
<option value="bounce">Bounce</option>
<option value="glow">Glow</option>
<option value="big">Big Text</option>
</select>

<br>

<button onclick="updatePreview()">Preview</button>
<button onclick="sendToBot()">Send to Bot</button>

<div id="preview" class="preview">Preview will appear here</div>

</div>

<script>

const tg = window.Telegram.WebApp;
tg.expand();

function updatePreview(){

    const text = document.getElementById("message").value;
    const color = document.getElementById("color").value;
    const effect = document.getElementById("effect").value;

    const preview = document.getElementById("preview");

    preview.className = "preview " + effect;
    preview.style.color = color;
    preview.innerText = text;
}

function sendToBot(){

    const text = document.getElementById("message").value;
    const color = document.getElementById("color").value;
    const effect = document.getElementById("effect").value;

    const data = {
        message:text,
        color:color,
        effect:effect
    };

    tg.sendData(JSON.stringify(data));
}

</script>

</body>
</html>
